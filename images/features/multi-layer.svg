<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img"
     aria-labelledby="t-ml d-ml">
  <title id="t-ml">Many layers over the same text</title>
  <desc id="d-ml">Three translucent annotation planes stacked above one line of text,
    with a link crossing from an entity on one plane to a chain on another.</desc>
  <!-- Draft illustration. Palette: $ci-1 #334D5C, $ci-3 #EFC94C, $ci-4 #E27A3F, $ci-5 #DF4949. -->
  <style>
    .plane{fill:#334D5C;opacity:.07;stroke:#334D5C;stroke-opacity:.35;stroke-width:1}
    .txt{fill:#BEBEBE}
    .ent{fill:#EFC94C;opacity:.5}
    .ent-b{fill:none;stroke:#E27A3F;stroke-width:1.5}
    .chain{fill:none;stroke:#DF4949;stroke-width:1.75}
    .dep{fill:none;stroke:#334D5C;stroke-width:1.5}
    .cross{fill:none;stroke:#E27A3F;stroke-width:1.5;stroke-dasharray:3 3}
    .cap{font:500 13px/1 system-ui,sans-serif;fill:#334D5C;opacity:.85}
  </style>

  <!-- three stacked planes, drawn back to front as sheared parallelograms -->
  <path class="plane" d="M70 34 L300 34 L250 66 L20 66 Z"/>
  <path class="plane" d="M70 84 L300 84 L250 116 L20 116 Z"/>
  <path class="plane" d="M70 134 L300 134 L250 166 L20 166 Z"/>

  <text class="cap" x="304" y="42" text-anchor="end">syntax</text>
  <text class="cap" x="304" y="92" text-anchor="end">coreference</text>
  <text class="cap" x="304" y="142" text-anchor="end">entities</text>

  <!-- top plane: dependency arcs -->
  <path class="dep" d="M96 58 q22 -18 44 0"  marker-end="url(#dep-a)"/>
  <path class="dep" d="M148 56 q26 -20 52 0" marker-end="url(#dep-a)"/>
  <defs>
    <marker id="dep-a" viewBox="0 0 7 7" refX="3.5" refY="3.5" markerWidth="4.5"
            markerHeight="4.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#334D5C"/>
    </marker>
  </defs>

  <!-- middle plane: a coreference chain linking two mentions -->
  <circle cx="98"  cy="104" r="4" fill="#DF4949"/>
  <circle cx="206" cy="100" r="4" fill="#DF4949"/>
  <path class="chain" d="M98 104 q54 -22 108 -4"/>

  <!-- bottom plane: entity spans over the text -->
  <rect class="ent"   x="86" y="146" width="46" height="15" rx="3"/>
  <rect class="ent-b" x="86" y="146" width="46" height="15" rx="3"/>
  <rect class="ent"   x="176" y="144" width="38" height="15" rx="3"/>
  <rect class="ent-b" x="176" y="144" width="38" height="15" rx="3"/>

  <!-- the point: a feature on one layer pointing at an annotation on another -->
  <path class="cross" d="M109 146 C 112 130, 100 118, 98 108"/>

  <!-- the shared text, underneath everything -->
  <rect class="txt" x="30" y="182" width="40" height="6" rx="3"/>
  <rect class="txt" x="76" y="182" width="52" height="6" rx="3"/>
  <rect class="txt" x="134" y="182" width="30" height="6" rx="3"/>
  <rect class="txt" x="170" y="182" width="44" height="6" rx="3"/>
  <rect class="txt" x="220" y="182" width="26" height="6" rx="3"/>
</svg>
